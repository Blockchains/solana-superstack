name: catalog-nightly
on:
  schedule: [{cron: "17 2 * * *"}]
  workflow_dispatch:
concurrency: {group: catalog, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch forker state (private repo)
        env: {GH_TOKEN: "${{ secrets.CATALOG_TOKEN }}"}
        run: |
          gh api repos/Blockchains/colosseum-forker/contents/state.json -H "Accept: application/vnd.github.raw" > /tmp/state.json
      - name: Refresh catalog (incremental)
        env: {GH_TOKEN: "${{ secrets.CATALOG_TOKEN }}"}
        run: python3 scripts/catalog.py /tmp/state.json
      - name: Commit
        run: |
          git config user.name superstack-bot; git config user.email actions@users.noreply.github.com
          git add catalog.json CATALOG.md repos
          git diff --cached --quiet || git commit -m "catalog: nightly refresh"
          git push origin HEAD:main
      - name: Notify sol-college
        env: {GH_TOKEN: "${{ secrets.CATALOG_TOKEN }}"}
        run: gh api repos/Blockchains/sol-college/dispatches -f event_type=catalog-updated
